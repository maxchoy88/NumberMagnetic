<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>至尊八星灵数 - 2500字全维度生命蓝图</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        :root {
            --primary-gold: #d4af37;
            --deep-indigo: #0f172a;
            --mystic-purple: #1e1b4b;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
            color: #e2e8f0;
            min-height: 100vh;
        }

        .serif { font-family: 'Noto Serif SC', serif; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .gold-glow {
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
        }

        .report-content {
            line-height: 2.5;
            font-size: 1.05rem;
            letter-spacing: 0.02em;
        }

        .star-item {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .star-item:hover {
            transform: translateY(-5px);
            border-color: var(--primary-gold);
        }

        #msgModal {
            display: none;
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            animation: bounceIn 0.5s ease;
        }

        @keyframes bounceIn {
            0% { transform: translate(-50%, -100px); opacity: 0; }
            70% { transform: translate(-50%, 10px); }
            100% { transform: translate(-50%, 0); opacity: 1; }
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .glass-panel { border: none !important; background: white !important; color: black !important; }
            .report-content { color: black !important; }
        }

        .btn-gradient {
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            color: #0f172a;
        }
    </style>
</head>
<body class="p-4 md:p-10 flex items-start justify-center">

    <!-- Toast Notification -->
    <div id="msgModal" class="bg-indigo-950 border border-amber-500/50 text-amber-100 px-8 py-4 rounded-full shadow-[0_0_30px_rgba(212,175,55,0.2)] flex items-center space-x-4">
        <span class="text-xl">✨</span>
        <span id="modalText" class="font-medium"></span>
        <button onclick="hideModal()" class="ml-4 hover:text-white font-bold text-lg">✕</button>
    </div>

    <div class="max-w-7xl w-full space-y-8">
        <!-- Main Header -->
        <header class="text-center space-y-4 no-print py-6">
            <h1 class="text-5xl md:text-6xl font-black serif tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-amber-200 to-amber-500">
                至尊八星灵数全书
            </h1>
            <p class="text-amber-500/80 tracking-[0.3em] font-light uppercase text-sm">Imperial Numerology & Life Blueprint Analysis</p>
        </header>

        <!-- Input Section -->
        <section class="glass-panel p-8 md:p-12 no-print">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase text-amber-500 tracking-widest pl-1">姓名/昵称</label>
                    <input type="text" id="nameInput" placeholder="阿盛" class="w-full bg-slate-900/50 border border-slate-700 rounded-2xl px-6 py-4 focus:border-amber-500 outline-none transition-all text-lg">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase text-amber-500 tracking-widest pl-1">电话号码 (10/11位)</label>
                    <input type="text" id="phoneInput" placeholder="请输入号码" class="w-full bg-slate-900/50 border border-slate-700 rounded-2xl px-6 py-4 focus:border-amber-500 outline-none transition-all text-2xl font-mono tracking-widest">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase text-amber-500 tracking-widest pl-1">电子邮件 (发送报告用)</label>
                    <input type="email" id="emailInput" placeholder="example@mail.com" class="w-full bg-slate-900/50 border border-slate-700 rounded-2xl px-6 py-4 focus:border-amber-500 outline-none transition-all text-lg">
                </div>
                <div class="flex items-end">
                    <button onclick="analyzeAll()" class="btn-gradient w-full h-[62px] rounded-2xl font-black text-xl uppercase tracking-widest hover:brightness-110 active:scale-95 transition-all shadow-lg shadow-amber-500/20">
                        开启推演
                    </button>
                </div>
            </div>
        </section>

        <!-- Result Display Area -->
        <main id="resultArea" class="hidden space-y-12 pb-20">
            <!-- Summary Dashboard -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <!-- Soul Core Card -->
                <div class="lg:col-span-4 glass-panel p-10 flex flex-col items-center justify-center text-center relative overflow-hidden group">
                    <div class="absolute -top-10 -right-10 w-40 h-40 bg-amber-500/10 rounded-full blur-3xl group-hover:bg-amber-500/20 transition-all"></div>
                    <p class="text-amber-500 text-xs font-bold uppercase tracking-[0.5em] mb-4">Soul Core Frequency</p>
                    <div id="soulNumber" class="text-[10rem] font-black serif leading-none text-amber-400 drop-shadow-[0_0_35px_rgba(212,175,55,0.4)]">0</div>
                    <div id="numberTag" class="mt-4 px-8 py-2 bg-amber-500 text-slate-950 font-black rounded-full text-lg tracking-widest">加载中</div>
                </div>

                <!-- Stars Briefing Grid -->
                <div class="lg:col-span-8 glass-panel p-10">
                    <div class="flex items-center justify-between mb-8 border-b border-slate-700 pb-4">
                        <h3 class="text-2xl font-bold serif flex items-center">
                            <span class="mr-4 text-amber-500 text-3xl">✦</span> 八星磁场能量看板
                        </h3>
                        <div class="text-[10px] text-slate-500 font-mono tracking-widest">ENERGY DISTRIBUTION MATRIX v4.0</div>
                    </div>
                    <div id="starBriefing" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <!-- Briefing items -->
                    </div>
                </div>
            </div>

            <!-- Action Toolbar (Hidden in Print) -->
            <div class="flex flex-wrap justify-center gap-4 no-print">
                <button onclick="shareToWhatsApp()" class="px-8 py-3 bg-[#25D366] text-white rounded-2xl font-bold hover:scale-105 transition-all flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                    WhatsApp 转发
                </button>
                <button onclick="shareToEmail()" class="px-8 py-3 bg-indigo-600 text-white rounded-2xl font-bold hover:scale-105 transition-all flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    发送邮件报告
                </button>
                <button onclick="window.print()" class="px-8 py-3 bg-slate-700 text-white rounded-2xl font-bold hover:scale-105 transition-all flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    打印 PDF 存档
                </button>
            </div>

            <!-- Deep Report Content -->
            <article id="masterReport" class="glass-panel p-10 md:p-20 report-content text-slate-300">
                <!-- Content generated via JS -->
            </article>
        </main>
    </div>

    <script>
        const starMap = {
            "13": "天医", "31": "天医", "68": "天医", "86": "天医", "49": "天医", "94": "天医", "27": "天医", "72": "天医",
            "19": "延年", "91": "延年", "78": "延年", "87": "延年", "34": "延年", "43": "延年", "26": "延年", "62": "延年",
            "14": "生气", "41": "生气", "67": "生气", "76": "生气", "39": "生气", "93": "生气", "28": "生气", "82": "生气",
            "11": "伏位", "22": "伏位", "33": "伏位", "44": "伏位", "55": "伏位", "66": "伏位", "77": "伏位", "88": "伏位", "99": "伏位", "00": "伏位",
            "12": "绝命", "21": "绝命", "69": "绝命", "96": "绝命", "48": "绝命", "84": "绝命", "37": "绝命", "73": "绝命",
            "18": "五鬼", "81": "五鬼", "79": "五鬼", "97": "五鬼", "36": "五鬼", "63": "五鬼", "24": "五鬼", "42": "五鬼",
            "16": "六煞", "61": "六煞", "47": "六煞", "74": "六煞", "38": "六煞", "83": "六煞", "29": "六煞", "92": "六煞",
            "17": "祸害", "71": "祸害", "89": "祸害", "98": "祸害", "46": "祸害", "64": "祸害", "23": "祸害", "32": "祸害"
        };

        const lifePathData = {
            1: "至尊开拓型", 2: "和谐统筹型", 3: "灵感表达型", 4: "基石务实型", 5: "风暴变革型", 6: "仁爱守护型", 7: "深度智思型", 8: "威权成就型", 9: "博爱超脱型"
        };

        const starMeta = {
            "天医": { type: "aus", label: "财库正缘", icon: "💎" },
            "延年": { type: "aus", label: "事业领导", icon: "🛡️" },
            "生气": { type: "aus", label: "贵人乐天", icon: "🎈" },
            "伏位": { type: "aus", label: "守成潜伏", icon: "🕰️" },
            "绝命": { type: "inaus", label: "极端破耗", icon: "⚡" },
            "五鬼": { type: "inaus", label: "变动多鬼", icon: "👻" },
            "六煞": { type: "inaus", label: "情伤桃花", icon: "🌊" },
            "祸害": { type: "inaus", label: "口舌病符", icon: "🔥" }
        };

        function showModal(text) {
            document.getElementById('modalText').innerText = text;
            document.getElementById('msgModal').style.display = 'flex';
            setTimeout(hideModal, 4000);
        }
        function hideModal() { document.getElementById('msgModal').style.display = 'none'; }

        function analyzeAll() {
            const name = document.getElementById('nameInput').value.trim() || "阿盛 (Castor)";
            const phone = document.getElementById('phoneInput').value.replace(/\D/g, '');
            
            if (phone.length < 10) {
                showModal('请填写 10 或 11 位号码，波才能为你推算。');
                return;
            }

            let soulNum = phone.split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
            while (soulNum > 9) soulNum = soulNum.toString().split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);

            const stats = { "天医": 0, "延年": 0, "生气": 0, "伏位": 0, "绝命": 0, "五鬼": 0, "六煞": 0, "祸害": 0 };
            const seq = [];
            for (let i = 0; i < phone.length - 1; i++) {
                let pair = phone.substring(i, i + 2);
                if (starMap[pair]) {
                    stats[starMap[pair]]++;
                    seq.push({ pair, name: starMap[pair] });
                }
            }

            renderResults(name, soulNum, stats, seq, phone);
        }

        function renderResults(name, soulNum, stats, seq, phone) {
            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('soulNumber').innerText = soulNum;
            document.getElementById('numberTag').innerText = lifePathData[soulNum];

            const briefDiv = document.getElementById('starBriefing');
            briefDiv.innerHTML = '';
            Object.keys(starMeta).forEach(star => {
                const count = stats[star];
                const meta = starMeta[star];
                const div = document.createElement('div');
                div.className = `star-item p-4 rounded-2xl border ${count > 0 ? (meta.type === 'aus' ? 'bg-amber-500/10 border-amber-500' : 'bg-rose-500/10 border-rose-500') : 'bg-slate-900 border-slate-800 opacity-30'}`;
                div.innerHTML = `
                    <div class="text-2xl mb-1">${meta.icon}</div>
                    <div class="text-[10px] font-bold opacity-70 uppercase">${meta.label}</div>
                    <div class="text-lg font-black">${star} x${count}</div>
                `;
                briefDiv.appendChild(div);
            });

            generateFullReport(name, soulNum, stats, seq, phone);
        }

        function generateFullReport(name, soulNum, stats, seq, phone) {
            const reportArea = document.getElementById('masterReport');
            const ausTotal = stats["天医"] + stats["延年"] + stats["生气"] + stats["伏位"];
            const inausTotal = stats["绝命"] + stats["五鬼"] + stats["六煞"] + stats["祸害"];
            
            // 构建 2500 字量级的内容（分块构造）
            let html = `<div class="space-y-16">`;

            // 前言与时空坐标
            html += `<section>
                <h2 class="text-4xl font-black serif text-amber-500 mb-8 border-b-2 border-amber-500/20 pb-4">引言：时空褶皱与数字能量场</h2>
                <p class="mb-6">尊敬的 <strong>${name}</strong>，当您在这一时刻寻求数字的指引，宇宙的波函数正因您的观测而坍缩。我们不仅仅在解析一串号码，更是在解构您当前这一生命阶段的能量蓝图。号码 <strong>${phone}</strong> 不仅仅是通信的载体，它是您个人磁场向外辐射的频率天线。</p>
                <p class="mb-6">基于您的灵数核心 <strong>${soulNum}</strong>，结合当前星曜能量，这份报告将跨越财富、事业、健康、情感及针对性对冲五大维度。我们要讨论的，是藏在平凡数字背后的非凡定数。阿盛，请记住：能量不是被消灭的，而是被转化的。</p>
            </section>`;

            // 第一篇章：性格本源 (Soul Path)
            html += `<section>
                <h3 class="text-2xl font-bold serif text-indigo-400 mb-6 flex items-center"><span class="mr-4">01</span> 第一篇章：灵魂内核与能量底色</h3>
                <p class="mb-4">在生命灵数的至尊体系中，数字 ${soulNum} 代表了您的“灵魂基调”。它是您在处理突发危机时的第一直觉，也是您在巅峰时刻最深沉的底气。解析显示，您的内核呈现出一种 <strong>“${lifePathData[soulNum]}”</strong> 的姿态。</p>
                <p class="mb-4">这意味着在面对复杂的商业博弈或人情世故时，您${soulNum % 2 === 0 ? '更倾向于逻辑的推演与深层的利益平衡。您具备一种天生的感召力，能够化干戈为玉帛，在无声中消解对峙。' : '拥有一种破局者的果敢。您厌恶一成不变的平庸，生命中充满了寻求突破、开创新世界的渴望。这种渴望是您一切成功的源头，也是您疲惫的起点。'}</p>
                <p class="mb-4">您的这种内核与号码中的八星磁场产生了复杂的纠缠。目前，您的场域正处于一个 <strong>“${ausTotal > inausTotal ? '黄金上升期' : '深层重构期'}”</strong>。在这种状态下，任何一次精准的沟通都会被号码中的磁场成倍放大，最终影响您的阶层跨越。</p>
            </section>`;

            // 第二篇章：财库推演 (Wealth)
            html += `<section>
                <h3 class="text-2xl font-bold serif text-amber-400 mb-6 flex items-center"><span class="mr-4">02</span> 第二篇章：财库深度与资产裂变逻辑</h3>
                <p class="mb-6">财富不仅是数字的积累，更是财库容量与流速的博弈。号码推演显示，<strong>${name}</strong> 拥有 <strong>${stats["天医"]}</strong> 组天医财星。天医代表着正财、代表着基于智慧与正直而获得的资产溢价。这意味着您的财源往往源于高净值的信息对接或专业领域的垂直深耕。</p>
                <p class="mb-6">然而，财库的“锁”在哪里？我们需要审视延年磁场。${stats["延年"] > 0 ? '您的号码中具备延年守财星，这意味着 <strong>${name}</strong> 的财务路径是稳健且具备长线持有价值的。您不仅仅是一个赚钱者，更是一个资产管理者。' : '由于缺乏显性的延年磁场，您的财富呈现出一种“流量式”的特征：进账极快，但防线薄弱。这暗示阿盛必须建立一套非数字的“物理防线”，将流动资金强制转化为不可移动的重资产，防止能量的外溢。'}</p>
                <p class="mb-6">在当前的财富格局下，大师给出的至尊配置方案是：利用“生气”磁场所附带的顶层人脉，撬动“天医”的高额回报。注意，如果您的号码末尾出现了“绝命”或“五鬼”，请务必在每年的阴历 ${soulNum} 月保持绝对的审慎，避免任何形式的投机性杠杆。财库的稳固，重在“避凶”而非“逐利”。</p>
            </section>`;

            // 第三篇章：事业与投资 (Investment)
            html += `<section>
                <h3 class="text-2xl font-bold serif text-emerald-400 mb-6 flex items-center"><span class="mr-4">03</span> 第三篇章：事业裂变与至尊资产配置建议</h3>
                <p class="mb-6">基于 <strong>${name}</strong> 的能量配比，我们为您定制了如下“资产锚点”：</p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="bg-indigo-900/40 p-6 rounded-3xl border-l-4 border-indigo-500">
                        <p class="font-bold text-indigo-300 mb-2 underline decoration-amber-500">核心底仓 (65%)</p>
                        <p class="text-sm">布局具有“伏位”特质的长周期品种。在当下变动巨大的环境中，唯有时间价值能对抗凶星的冲击。建议配置：核心实物金、高股息资产。</p>
                    </div>
                    <div class="bg-amber-900/40 p-6 rounded-3xl border-l-4 border-amber-500">
                        <p class="font-bold text-amber-300 mb-2 underline decoration-indigo-500">成长攻坚 (25%)</p>
                        <p class="text-sm">利用“生气”带来的圈层信息。关注人工智能、生物科技等硬科技赛道。您的号码预示：您的贵人往往出现在 ${soulNum === 1 ? '东方' : '南方'}。</p>
